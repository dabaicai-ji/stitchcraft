[build]
  command = "npm run build"
  publish = "dist"

# Edge Function 路径映射：前端固定请求 /api/insight，与本地 Vite 代理保持一致
[[edge_functions]]
  function = "insight"
  path = "/api/insight"

# ---------------------------------------------------------------------------
# 云端 AI 插画：普通 Function（提交 / 轮询）+ Background Function（真正调火山）
#
# 为什么是两种函数：Seedream 单张 8–15s，普通 Function 免费版 10s 超时；
# ai-style-run-background 由平台回 202、后台继续跑到 15 分钟。
# 目录约定：netlify/functions/*.ts（_ 开头的目录/文件不会被当成函数）
# ---------------------------------------------------------------------------
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/ai-style"
  to = "/.netlify/functions/ai-style"
  status = 200
  force = true

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# 静态资源缓存：Vite 产物都带内容哈希，必须长缓存
# ---------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 中文子集字体 78KB，同属带哈希产物路径时可一并长缓存
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
