[build]
  command = "npm run build"
  publish = "dist"

# Edge Function 路径映射：前端固定请求 /api/insight，与本地 Vite 代理保持一致
[[edge_functions]]
  function = "insight"
  path = "/api/insight"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# 静态资源缓存：Vite 产物都带内容哈希，必须长缓存
# ---------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 中文子集字体 78KB，同属带哈希产物路径时可一并长缓存
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
